name: E-Hutan Android CI/CD

on:
  push:
    tags:
      - 'v*' # Otomatis jalan ketika Anda push tag baru (misal: v1.0.0)
  workflow_dispatch: # Mengizinkan Anda memicu build secara manual via tombol di GitHub UI

# Izin menulis konten wajib diaktifkan agar bot GitHub Actions bisa membuat Release dan upload APK
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode repositori ke runner server
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Ambil dependencies Flutter
      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      # 5. Injeksi Kredensial Download Mapbox ke gradle.properties
      - name: Configure Mapbox Downloads SDK
        run: |
          echo "MAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> frontend/android/gradle.properties

      # 6. Buat file .env secara dinamis untuk asset bundling Flutter
      - name: Create .env File
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > frontend/.env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> frontend/.env
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" >> frontend/.env

      # 7. Jalankan Verifikasi Kode (Linter & Test)
      - name: Run Static Analysis & Unit Tests
        run: |
          cd frontend
          flutter analyze
          flutter test

      # 8. Kompilasi APK Rilis
      - name: Build Release APK
        run: |
          cd frontend
          flutter build apk --release

      # 9. Publikasikan ke GitHub Releases & Upload APK secara Otomatis
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
          name: E-Hutan Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
